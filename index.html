<html lang="ar" dir="rtl">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">

        html, body { overflow: hidden; overscroll-behavior-y: contain; position: fixed; width: 100%;
height: 100%; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text);
font-family: 'Cairo', sans-serif; display: flex; align-items: center; justify-content: center; }
        .app-viewport { width: 95%;
max-width: 400px; height: 620px; background: var(--card-bg); border: 2px solid var(--primary); border-radius: 20px; position: relative; overflow: hidden;
box-shadow: 0 0 30px rgba(0,242,255,0.2); }
        .screen { position: absolute; width: 100%;
height: 100%; padding: 25px; display: none; flex-direction: column; align-items: center; box-sizing: border-box;
}
        .active { display: flex; animation: fadeIn 0.3s;
}
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1;
} }
        h1 { font-family: 'Press Start 2P'; font-size: 11px; color: var(--primary);
margin-bottom: 20px; text-align: center; }
        .main-btn { width: 100%; padding: 14px; border-radius: 12px;
border: none; background: var(--secondary); color: white; font-weight: bold; cursor: pointer; margin-top: 8px; box-shadow: 0 4px 0 #4a00aa; flex-shrink: 0;
}
        .main-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #4a00aa;
}
        .main-btn:disabled { background: #444 !important; box-shadow: none !important; color: #aaa; cursor: not-allowed;
}
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333;
background: #000; color: #fff; text-align: center; margin-bottom: 10px; }
        .player-list { width: 100%;
flex-grow: 1; overflow-y: auto; background: rgba(0,0,0,0.3); border-radius: 10px; padding: 10px; margin-bottom: 10px; border: 1px solid #222;
}
        .player-tag { background: #252535; padding: 6px 12px; margin: 3px; border-radius: 20px;
display: inline-flex; align-items: center; gap: 8px; font-size: 11px; border: 1px solid var(--primary);
}
        .kick-btn { background: none; border: none; color: var(--imposter); font-weight: bold; cursor: pointer;
padding: 0; font-size: 12px; }
        .round-badge { background: var(--imposter); color: white;
padding: 4px 15px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 15px;
}
        .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%;
margin-bottom: 10px; }
        .cat-btn { background: #1a1a2e; color: #aaa; border: 1px solid #333;
padding: 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .cat-btn.selected { background: var(--primary);
color: #000; border-color: var(--primary); }
        .secret-card { width: 100%; height: 150px; background: #05050a;
border: 2px dashed var(--secondary); border-radius: 15px; display: flex; align-items: center; justify-content: center; margin: 15px 0; cursor: pointer; text-align: center;
}
        .vote-btn { background: #2d2d44; color: white; border: 1px solid var(--primary); padding: 10px;
margin: 5px 0; width: 100%; border-radius: 8px; cursor: pointer; text-align: center;
}
        .vote-btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: #333;
}
        .score-row { display: flex; justify-content: space-between; width: 100%; padding: 8px 10px;
border-bottom: 1px solid #333; font-size: 14px; }
        .config-label { font-size: 11px; color: var(--primary);
margin: 5px 0; width: 100%; text-align: right; }
        .imp-toggle-grid { display: grid;
grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-bottom: 15px; }
        .imp-toggle-btn { background: #1a1a2e;
color: #aaa; border: 1px solid #333; padding: 8px; border-radius: 8px; font-size: 11px; cursor: pointer; font-family: 'Cairo';
}
        .imp-toggle-btn.selected { background: var(--imposter); color: #fff; border-color: var(--imposter);
box-shadow: 0 0 10px var(--imposter); }
        
        .rooms-radar { width: 100%;
background: rgba(0,0,0,0.4); border: 1px dashed #333; border-radius: 12px; padding: 10px; margin-top: 10px; max-height: 110px; overflow-y: auto; box-sizing: border-box;
}
        .radar-title { font-size: 10px; color: var(--primary); text-align: center; margin-bottom: 6px; letter-spacing: 1px;
}
        .room-item { background: #1a1a2e; border: 1px solid var(--secondary); padding: 8px; margin-bottom: 5px;
border-radius: 8px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
}
        .room-item:hover { border-color: var(--success);

        .screen .main-btn {

        }
    </style>
</head>

 <button class="cat-btn selected" onclick="selectCat('حيوانات وحشرات', this)">حيوانات وحشرات</button>

            </div>
        </div>
 
        
        <div class="player-list" id="player-list-container"></div>
        <button id="start-game-btn" class="main-btn" style="display:none;

        <button id="delete-room-btn" class="main-btn" style="display:none; background: var(--imposter);

    </div>

    <div id="play-screen" class="screen">
        <div id="category-hint" style="background: rgba(0,242,255,0.1);

        </div>

        <button class="main-btn" id="go-to-vote-btn" onclick="showVoteScreen()" style="display:none;">انتقل للتصويت</button>
    </div>

    <div id="vote-screen" class="screen">

</div>

    };
// تشغيل الرادار + التنظيف الذاتي للغرف القديمة عند الإقلاع
    listenToAvailableRooms();
    cleanOldRooms();
function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
}

    function selectCat(cat, btn) {
        selectedCategory = cat;
document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function selectImpCount(count, btn) {
        allowedImpostersCount = count;
document.querySelectorAll('.imp-toggle-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    function disableHomeButtons() {
        document.getElementById('create-btn').disabled = true;
document.getElementById('create-btn').innerText = "جاري الاتصال...";
        document.getElementById('join-btn').disabled = true;
        document.getElementById('join-btn').innerText = "جاري الاتصال...";
}

    function enableHomeButtons() {
        document.getElementById('create-btn').disabled = false;
document.getElementById('create-btn').innerText = "إنشاء غرفة جديدة";
        document.getElementById('join-btn').disabled = false;
        document.getElementById('join-btn').innerText = "انضمام للغرفة";
}

    function cleanOldRooms() {
        db.ref('rooms').once('value', snap => {
            const rooms = snap.val();
            if (!rooms) return;
            const now = Date.now();
            const sixHours = 6 * 60 * 60 * 1000;

            Object.keys(rooms).forEach(roomId => {
    
            const room = rooms[roomId];
                if (!room.createdAt) {
                    db.ref('rooms/' + roomId).update({ createdAt: now });
                } else if (now - room.createdAt > sixHours || !room.players) {
                
    db.ref('rooms/' + roomId).remove();
                }
            });
        });
}

    function listenToAvailableRooms() {
        db.ref('rooms').on('value', snap => {
            const container = document.getElementById('available-rooms-container');
            if(!container) return;
            const roomsData = snap.val();
            if(!roomsData) {
                container.innerHTML = "لا توجد غرف نشطة حالياً";
     
           return;
            }
            
            container.innerHTML = "";
            let hasRooms = false;
            
            Object.keys(roomsData).forEach(roomId => {
          
      const room = roomsData[roomId];
                if(room.status === 'waiting') {
                    hasRooms = true;
                    let hostId = room.host;
                    let hostName = room.players && room.players[hostId] ? 
room.players[hostId].name : "مجهول";
                    let pCount = room.players ? Object.keys(room.players).length : 0;
                    
                    container.innerHTML += `
                        <div class="room-item" onclick="quickJoin('${roomId}')">
   
                          <span style="color:var(--success)">🎯 غرفة: ${hostName}</span>
                            <span style="color:#aaa">${pCount} لاعبين ❯</span>
                        </div>
                 
   `;
                }
            });
if(!hasRooms) container.innerHTML = "لا توجد غرف نشطة حالياً";
        });
    }

    function quickJoin(roomId) {
        document.getElementById('room-id-input').value = roomId;
joinExistingRoom();
    }

    function createNewRoom() {
        myName = document.getElementById('user-name').value;
if(!myName) return alert("اكتب اسمك أولاً");
        

        disableHomeButtons();
        currentRoom = Math.floor(1000 + Math.random() * 9000).toString();
        isHost = true;
myId = "u_" + Date.now();
        
        saveSessionLocally();
        db.ref('rooms/' + currentRoom).set({ 
            host: myId, 
            status: 'waiting', 
            round: 1,
            createdAt: Date.now(),
            players: { [myId]: {name: myName, score: 0} } 
        }).then(() => {
       
     listenToRoom();
        }).catch(() => {
            enableHomeButtons();
        });
document.getElementById('host-controls').style.display = 'block';
        document.getElementById('delete-room-btn').style.display = 'block';
    }

    function joinExistingRoom() {
        let inputId = document.getElementById('room-id-input').value;
myName = document.getElementById('user-name').value;
        if(!myName || !inputId) return alert("اكمل البيانات");
        
        disableHomeButtons();
        currentRoom = inputId;
        myId = "u_" + Date.now();
db.ref('rooms/' + currentRoom).once('value', snap => {
            if(snap.exists()) {
                saveSessionLocally();
                db.ref('rooms/' + currentRoom + '/players/' + myId).set({name: myName, score: 0})
                .then(() => listenToRoom());
            } else { 
        
        alert("الغرفة غير موجودة"); 
                enableHomeButtons();
            }
        }).catch(() => enableHomeButtons());
}

    function kickPlayer(playerId) {
        if(!isHost) return;
db.ref('rooms/' + currentRoom + '/players/' + playerId).remove();
    }

    function deleteRoomByHost() {
        if(!isHost || !currentRoom) return;
if(confirm("هل أنت متأكد من رغبتك في إغلاق وحذف هذه الغرفة نهائياً؟")) {
            db.ref('rooms/' + currentRoom).remove().then(() => {
                clearAndReload();
            });
}
    }

    function saveSessionLocally() {
        localStorage.setItem('savedName', myName);
localStorage.setItem('lastRoom', currentRoom);
        localStorage.setItem('myId', myId);
    }

    function clearAndReload() {
        localStorage.removeItem('lastRoom');
        localStorage.removeItem('myId');
location.reload();
    }

    function checkAutoReconnect() {
        const oldRoom = localStorage.getItem('lastRoom');
const oldId = localStorage.getItem('myId');
        db.ref('rooms/' + oldRoom).once('value', snap => {
            if(snap.exists() && snap.val().players[oldId]) {
                currentRoom = oldRoom; myId = oldId;
                myName = snap.val().players[oldId].name;
                isHost = (snap.val().host === myId);
                if(isHost) 
{
                    document.getElementById('host-controls').style.display = 'block';
                    document.getElementById('delete-room-btn').style.display = 'block';
                }
                listenToRoom();
            } else { alert("لا يمكن الاستعادة"); localStorage.removeItem('lastRoom'); location.reload(); }
    
    });
    }

    function listenToRoom() {
        document.getElementById('display-room-id').innerText = currentRoom;
document.getElementById('reconnect-hint').style.display = "none";
        
        db.ref('rooms/' + currentRoom + '/players/' + myId).on('value', snap => {
            if(!snap.exists() && currentRoom !== null && !isHost) {
                db.ref('rooms/' + currentRoom).off();
                alert("تم طردك من الغرفة بواسطة الآدمين");
                clearAndReload();
            }
  
        });

        db.ref('rooms/' + currentRoom).on('value', snap => {
            const data = snap.val(); 
            
            if(!data && currentRoom !== null) {
                db.ref('rooms/' + currentRoom).off();
                if(!isHost) alert("تم إغلاق الغرفة من قبل المضيف");
   
             clearAndReload();
                return;
            }
            
            gameData = data;
            if(data.status === 'waiting') {
                showScreen('lobby-screen');
  
              enableHomeButtons(); 
                document.getElementById('round-display').innerText = `الجولة: ${data.round} / 5`;
            }
            const list = document.getElementById('player-list-container');
            list.innerHTML = "";
            
           
 Object.keys(data.players).forEach(pId => { 
                const p = data.players[pId];
                let kickMarkup = (isHost && pId !== myId) ? `<button class="kick-btn" onclick="kickPlayer('${pId}')">❌</button>` : '';
list.innerHTML += `<div class="player-tag">${p.name} (${p.score}) ${kickMarkup}</div>`; 
            });
            
            const pCount = Object.keys(data.players).length;
            const requiredPlayers = (allowedImpostersCount === 2) ?
4 : 3;
            
            if(isHost && data.status === 'waiting' && pCount >= requiredPlayers) {
                document.getElementById('start-game-btn').style.display = 'block';
} else {
                document.getElementById('start-game-btn').style.display = 'none';
}
            
            if(data.status === 'playing') setupGame();
if(data.status === 'voting') renderVoteOptions();
            if(data.status === 'results') showFinalResults();
        });
    }

    function triggerStart() {
        const words = megaDatabase[selectedCategory], word = words[Math.floor(Math.random() * words.length)];
const pIds = Object.keys(gameData.players);
        const previousImposters = gameData.imposters || [];
// تصفية اللاعبين لاستبعاد من كان محتالاً في الجولة السابقة لمنع التكرار المتتالي
        let eligiblePlayers = pIds.filter(id => !previousImposters.includes(id));
// حماية: إذا كان عدد اللاعبين المتبقين غير كافٍ لعدد المحتالين المطلوب، نلغي الاستبعاد ونعتمد على الجميع
        if (eligiblePlayers.length < allowedImpostersCount) {
            eligiblePlayers = pIds;
        }

        let imposterIds = [];
if (allowedImpostersCount === 2 && eligiblePlayers.length >= 4) {
            let firstImp = eligiblePlayers[Math.floor(Math.random() * eligiblePlayers.length)];
imposterIds.push(firstImp);
            
            let remainingEligible = eligiblePlayers.filter(id => id !== firstImp);
            let secondImp = remainingEligible[Math.floor(Math.random() * remainingEligible.length)];
            imposterIds.push(secondImp);
} else {
            imposterIds.push(eligiblePlayers[Math.floor(Math.random() * eligiblePlayers.length)]);
}

        db.ref('rooms/' + currentRoom).update({ 
            status: 'playing', 
            word: word, 
            category: selectedCategory, 
            imposters: imposterIds, 
            votes: {} 
        });
}

    function changeCurrentWord() {
        if(!isHost || !currentRoom || !gameData.category) return;
const words = megaDatabase[gameData.category];
        let newWord;
        do {
            newWord = words[Math.floor(Math.random() * words.length)];
} while (newWord === gameData.word);

        db.ref('rooms/' + currentRoom).update({ word: newWord });
}

    function setupGame() {
        showScreen('play-screen');
        clickState = 0;
document.getElementById('category-hint').innerText = "المجال: " + gameData.category;
        document.getElementById('secret-content').innerText = "[ اضغط لفك التشفير ]";
        document.getElementById('change-word-btn').style.display = isHost ? 'block' : 'none';
document.getElementById('go-to-vote-btn').style.display = isHost ? 'block' : 'none';
    }

    function toggleSecret() {
    const imps = gameData.imposters ||
[];
    const isImp = imps.includes(myId);
    const content = document.getElementById('secret-content');

    if (!isImp) {
        // اللاعب العادي يرى الكلمة السرية فقط باللون الأخضر المميز
        content.innerHTML = `<span style="color:var(--success); font-size: 20px;">${gameData.word}</span>`;
} else {
        // المحتال يرى جملة "أنت المحتال" فقط باللون الأخضر المميز
        content.innerHTML = `<span style="color:var(--success); font-size: 20px;">أنت المحتال</span>`;
}
}

    function showVoteScreen() { db.ref('rooms/' + currentRoom).update({ status: 'voting' });
}

    function renderVoteOptions() {
        showScreen('vote-screen');
        const container = document.getElementById('vote-options');
const title = document.getElementById('vote-screen-title');
        const impsCount = (gameData.imposters || []).length;
if (gameData.votes && gameData.votes[myId]) {
            container.innerHTML = "<p>تم تسجيل صوتك بنجاح. انتظر البقية...</p>";
checkVotesComplete(); return;
        }
        
        selectedVotes = [];
title.innerText = (impsCount === 2) ? "اختر المحتال الأول (1)" : "من هو المحتال؟";

        container.innerHTML = "";
Object.keys(gameData.players).forEach(id => {
            if (id !== myId) {
                const btn = document.createElement('button');
                btn.className = "vote-btn";
                btn.id = "v-btn-" + id;
                btn.innerText = gameData.players[id].name;
       
                 btn.onclick = () => handleVoteSelection(id, btn);
                container.appendChild(btn);
            }
        });
}

    function handleVoteSelection(votedId, btnElement) {
        const impsCount = (gameData.imposters || []).length;
const title = document.getElementById('vote-screen-title');

        if (impsCount === 2) {
            selectedVotes.push(votedId);
btnElement.disabled = true; 
            
            if (selectedVotes.length === 1) {
                title.innerText = "اختر المحتال الثاني (2)";
} else if (selectedVotes.length === 2) {
                document.querySelectorAll('.vote-btn').forEach(btn => btn.disabled = true);
let mergedVotes = selectedVotes.join(","); 
                submitVote(mergedVotes);
            }
        } else {
            document.querySelectorAll('.vote-btn').forEach(btn => btn.disabled = true);
submitVote(votedId);
        }
    }

    function submitVote(votedValue) {
        db.ref('rooms/' + currentRoom + '/votes/' + myId).set(votedValue).then(() => checkVotesComplete());
}

    function checkVotesComplete() {
        db.ref('rooms/' + currentRoom).once('value', snap => {
            const data = snap.val();
            const votesData = data.votes || {};
            const votersCount = Object.keys(votesData).length;
            const totalRequired = Object.keys(data.players).length;
            if (votersCount >= totalRequired && data.status === 
'voting') calculateScores(data);
        });
}

    function calculateScores(data) {
        let updates = {};
const imps = data.imposters || [];
        let votesAgainstEachImp = {};
        
        imps.forEach(id => { votesAgainstEachImp[id] = 0; });
const totalVoters = Object.keys(data.players).length - imps.length;

        Object.keys(data.players).forEach(pId => {
            let currentScore = data.players[pId].score || 0;
            
            if (!imps.includes(pId)) {
                let voteValue = data.votes[pId] || "";
                let playerVotes = voteValue.split(","); 
        
                
                playerVotes.forEach(votedFor => {
                    if (imps.includes(votedFor)) {
                        currentScore += 1;
                        votesAgainstEachImp[votedFor]++;
  
                    }
                });
            }
            updates[`players/${pId}/score`] = currentScore;
        });
imps.forEach(impId => {
            let impScore = data.players[impId].score || 0;
            let votesAgainstThisImp = votesAgainstEachImp[impId] || 0;
            
            if (votesAgainstThisImp < (totalVoters / 2)) {
                impScore += 2;
            }
    
        updates[`players/${impId}/score`] = impScore;
        });
updates['status'] = 'results';
        db.ref('rooms/' + currentRoom).update(updates);
    }

    function showFinalResults() {
        showScreen('result-screen');
const imps = gameData.imposters || [];
        let impNames = imps.map(id => gameData.players[id] ? gameData.players[id].name : "لاعب غادر").join(" و ");
document.getElementById('res-imp-name').innerText = impNames;
        const container = document.getElementById('scores-container');
        container.innerHTML = "";
        
        const sorted = Object.keys(gameData.players).sort((a,b) => gameData.players[b].score - gameData.players[a].score);
sorted.forEach(id => {
            container.innerHTML += `<div class="score-row"><span>${gameData.players[id].name}</span><span style="color:var(--primary)">${gameData.players[id].score} pts</span></div>`;
        });
document.getElementById('next-round-btn').style.display = (isHost && gameData.round < 5) ? 'block' : 'none';
        document.getElementById('finish-btn').style.display = (isHost && gameData.round >= 5) ?
'block' : 'none';
        document.getElementById('exit-btn').style.display = (!isHost && gameData.round >= 5) ? 'block' : 'none';
}

    function backToLobby() {
        db.ref('rooms/' + currentRoom).update({ status: 'waiting', round: gameData.round + 1, votes: {}, word: null });
}
